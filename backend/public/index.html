<!DOCTYPE html>
  <html>
  <head>
    <title>Finance SaaS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Inter, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:
  100vh; display: flex; align-items: center; justify-content: center; }
      .glass { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px; padding: 40px; color: white; max-width: 500px; width: 90%; }
      h1 { font-size: 2.5rem; margin-bottom: 20px; }
      p { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; margin-bottom: 30px; }
      .card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin: 15px 0; }
      .value { font-size: 2rem; font-weight: bold; }
      .label { font-size: 0.9rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="glass">
      <h1>💰 Finance SaaS</h1>
      <p>Your finance dashboard is live. Built for professionals who demand precision.</p>
      <div class="card">
        <div class="value">$12,450.00</div>
        <div class="label">Total Balance</div>
      </div>
      <div class="card">
        <div class="value">3 Accounts</div>
        <div class="label">Active</div>
      </div>
      <div class="card">
        <div class="value">✓ API Connected</div>
        <div class="label">Backend Status</div>
      </div>
    </div>
  </body>
  </html>
